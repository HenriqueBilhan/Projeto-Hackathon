<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="t d">
  <title id="t">Rede de saúde conectada</title>
  <desc id="d">Ilustração: o prontuário do paciente no centro, conectado a UBS, UPA, hospital, laboratório e clínica.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AD8E6"/><stop offset=".55" stop-color="#1E7FC4"/><stop offset="1" stop-color="#0047AB"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F2440" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Linhas de conexão -->
  <g stroke="#9CC9EE" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M260 190 L90 80"/><path d="M260 190 L430 80"/><path d="M260 190 L70 250"/>
    <path d="M260 190 L450 250"/><path d="M260 190 L260 335"/>
  </g>
  <g fill="#1E7FC4">
    <circle cx="175" cy="135" r="4"/><circle cx="345" cy="135" r="4"/><circle cx="165" cy="220" r="4"/>
    <circle cx="355" cy="220" r="4"/><circle cx="260" cy="262" r="4"/>
  </g>

  <!-- Cartão central: prontuário do paciente -->
  <g filter="url(#s)">
    <rect x="180" y="128" width="160" height="124" rx="18" fill="#fff"/>
  </g>
  <rect x="180" y="128" width="160" height="34" rx="18" fill="url(#g)"/>
  <rect x="180" y="146" width="160" height="16" fill="url(#g)"/>
  <circle cx="204" cy="145" r="9" fill="#fff" opacity=".9"/>
  <rect x="220" y="140" width="70" height="10" rx="5" fill="#fff" opacity=".85"/>
  <path d="M196 196 h22 l8 -16 l12 30 l9 -14 h20" stroke="#1E7FC4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="276" y="182" width="48" height="8" rx="4" fill="#D6E8F8"/>
  <rect x="276" y="196" width="36" height="8" rx="4" fill="#D6E8F8"/>
  <rect x="196" y="222" width="128" height="8" rx="4" fill="#EAF3FC"/>
  <rect x="196" y="236" width="90" height="6" rx="3" fill="#EAF3FC"/>

  <!-- Unidades -->
  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g filter="url(#s)"><rect x="40" y="48" width="100" height="62" rx="14" fill="#fff"/></g>
    <rect x="76" y="58" width="28" height="22" rx="6" fill="#DCF5EA"/>
    <path d="M90 63 v12 M84 69 h12" stroke="#16865A" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="99" fill="#116B45">UBS</text>

    <g filter="url(#s)"><rect x="380" y="48" width="100" height="62" rx="14" fill="#fff"/></g>
    <rect x="416" y="58" width="28" height="22" rx="6" fill="#FDE8E8"/>
    <path d="M430 63 v12 M424 69 h12" stroke="#C22E2E" stroke-width="3" stroke-linecap="round"/>
    <text x="430" y="99" fill="#A61B1B">UPA</text>

    <g filter="url(#s)"><rect x="14" y="220" width="112" height="62" rx="14" fill="#fff"/></g>
    <rect x="56" y="230" width="28" height="22" rx="6" fill="#E3ECFD"/>
    <path d="M64 248 v-12 h12 v12 M70 239 v6" stroke="#2353B8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="70" y="271" fill="#1D4CA8">Hospital</text>

    <g filter="url(#s)"><rect x="390" y="220" width="120" height="62" rx="14" fill="#fff"/></g>
    <rect x="436" y="230" width="28" height="22" rx="6" fill="#F1E8FD"/>
    <path d="M446 234 v6 l-5 9 h18 l-5 -9 v-6" stroke="#6A31B8" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <text x="450" y="271" fill="#6227A8">Laboratório</text>

    <g filter="url(#s)"><rect x="205" y="305" width="110" height="62" rx="14" fill="#fff"/></g>
    <rect x="246" y="315" width="28" height="22" rx="6" fill="#DFF6F8"/>
    <circle cx="260" cy="326" r="6" stroke="#0F7D8C" stroke-width="2.5" fill="none"/>
    <text x="260" y="356" fill="#0D6A78">Clínica</text>
  </g>

  <!-- Escudo de segurança -->
  <g transform="translate(316 108)">
    <circle r="20" fill="#fff" filter="url(#s)"/>
    <path d="M0 -11 l9 4 v6 c0 6 -4 10 -9 12 c-5 -2 -9 -6 -9 -12 v-6 z" fill="url(#g)"/>
    <path d="M-4 0 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
