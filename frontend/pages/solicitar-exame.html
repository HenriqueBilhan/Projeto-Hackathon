<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conecta — plataforma integrada de saúde pública (protótipo com dados fictícios).">
  <title>Solicitação de exames | Conecta</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/medico.css">
  <link rel="stylesheet" href="../css/responsividade.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/exames.js" defer></script>
  <script src="../js/medico.js" defer></script>
  <script src="../js/atendimento.js" defer></script>
</head>
<body data-page="exames-medico" data-roles="medico">
  <!-- Tela de carregamento -->
  <div class="loader" id="loader" role="status" aria-label="Carregando">
    <span class="logo-crop"><img src="../assets/img/logo-conecta.png" alt="Conecta"></span>
    <div class="loader-bar"><span></span></div>
    <p>Carregando seu ambiente seguro…</p>
  </div>

  <!-- O menu lateral e o cabeçalho são montados por js/main.js (montarShell) -->
  <main>

    <div class="page-head"><div><h1>Exames</h1><p>Solicite exames e acompanhe cada etapa: solicitado, agendado, em andamento e resultado disponível.</p></div></div>
    <section class="card" aria-labelledby="t-fluxo"><div class="card-header"><h2 id="t-fluxo"><i data-lucide="workflow" aria-hidden="true"></i> Fluxo das solicitações</h2><span class="small muted">Clique em uma etapa para filtrar</span></div><div class="flow" id="fluxo-exames"></div></section>
    <div class="form-layout section">
      <section class="card" aria-labelledby="t-sol">
        <div class="card-header"><h2 id="t-sol"><i data-lucide="list-checks" aria-hidden="true"></i> Solicitações</h2>
          <div class="btn-row">
            <div class="field"><label for="ex-filtro" class="sr-only">Status</label><select class="select" id="ex-filtro"><option value="">Todos os status</option><option>Solicitado</option><option>Agendado</option><option>Em andamento</option><option>Resultado disponível</option></select></div>
            <div class="field"><label for="ex-escopo" class="sr-only">Escopo</label><select class="select" id="ex-escopo"><option value="minhas">Minhas solicitações</option><option value="todas">Todas da rede</option></select></div>
          </div>
        </div>
        <div id="lista-solicitacoes"></div>
      </section>
      <aside class="form-aside" aria-labelledby="t-nova"><section class="card"><div class="card-header"><h2 id="t-nova"><i data-lucide="file-plus-2" aria-hidden="true"></i> Nova solicitação</h2></div>
        <form id="form-exame" class="form-grid" novalidate>
          <div class="field span-all"><label for="ex-paciente">Paciente <span class="req" aria-hidden="true">*</span></label><select class="select" id="ex-paciente" name="paciente" required><option value="">Selecione</option></select><span class="field-error" data-erro-de="ex-paciente"></span></div>
          <div class="field span-all"><label for="ex-tipo">Tipo de exame <span class="req" aria-hidden="true">*</span></label><select class="select" id="ex-tipo" name="exame" required><option value="">Selecione</option></select><span class="field-error" data-erro-de="ex-tipo"></span></div>
          <div class="field span-all"><label for="ex-justificativa">Justificativa clínica <span class="req" aria-hidden="true">*</span></label><textarea class="textarea" id="ex-justificativa" name="justificativa" rows="3" placeholder="Indicação clínica do exame" required></textarea><span class="field-error" data-erro-de="ex-justificativa"></span></div>
          <div class="field span-all"><label for="ex-prioridade">Prioridade</label><select class="select" id="ex-prioridade" name="prioridade"><option value="Rotina">Rotina</option><option value="Urgente">Urgente</option><option value="Emergência">Emergência</option></select></div>
          <div class="field span-all"><label for="ex-unidade">Unidade solicitante <span class="req" aria-hidden="true">*</span></label><select class="select" id="ex-unidade" name="unidade" required></select><span class="field-error" data-erro-de="ex-unidade"></span></div>
          <div class="span-all"><button type="submit" class="btn btn-primary btn-block"><i data-lucide="send" aria-hidden="true"></i> Registrar solicitação</button></div>
        </form></section></aside>
    </div>
  </main>
</body>
</html>
