<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conecta — plataforma integrada de saúde pública.">
  <title>Meus exames | Conecta</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/paciente.css">
  <link rel="stylesheet" href="../css/responsividade.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/exames.js" defer></script>
  <script src="../js/paciente.js" defer></script>
</head>
<body data-page="exames" data-roles="paciente">
  <!-- Tela de carregamento -->
  <div class="loader" id="loader" role="status" aria-label="Carregando">
    <span class="logo-crop"><img src="../assets/img/logo-conecta.png" alt="Conecta"></span>
    <div class="loader-bar"><span></span></div>
    <p>Carregando seu ambiente seguro…</p>
  </div>

  <!-- O menu lateral e o cabeçalho são montados por js/main.js (montarShell) -->
  <main>

    <div class="page-head"><div><h1>Meus exames</h1><p>Consulte resultados, acompanhe exames em andamento e baixe seus laudos.</p></div></div>
    <section aria-label="Resumo dos exames"><div class="grid grid-4" id="resumo-exames"></div></section>
    <section class="card section" aria-labelledby="t-ex">
      <div class="card-header"><h2 id="t-ex"><i data-lucide="flask-conical" aria-hidden="true"></i> Exames realizados</h2></div>
      <form id="filtros-exames" class="filters" role="search">
        <div class="field"><label for="f-nome">Nome do exame</label><input class="input" id="f-nome" name="nome" type="text" placeholder="Ex.: hemograma"><span class="field-error" data-erro-de="f-nome"></span></div>
        <div class="field"><label for="f-de">Data inicial</label><input class="input" id="f-de" name="de" type="date"><span class="field-error" data-erro-de="f-de"></span></div>
        <div class="field"><label for="f-ate">Data final</label><input class="input" id="f-ate" name="ate" type="date"><span class="field-error" data-erro-de="f-ate"></span></div>
        <div class="field"><label for="f-unidade">Unidade</label><select class="select" id="f-unidade" name="unidade"><option value="">Todas</option></select></div>
        <div class="field"><label for="f-status">Status</label><select class="select" id="f-status" name="status"><option value="">Todos</option><option value="Resultado disponível">Resultado disponível</option><option value="Em análise">Em análise</option><option value="Agendado">Agendado</option><option value="Solicitado">Solicitado</option></select></div>
        <div class="field"><span class="label" aria-hidden="true">&nbsp;</span><button type="reset" class="btn btn-ghost"><i data-lucide="rotate-ccw" aria-hidden="true"></i> Limpar filtros</button></div>
      </form>
      <p class="filter-count" id="contagem-exames" aria-live="polite"></p>
      <div id="tabela-exames"></div>
    </section>
  </main>
</body>
</html>
