<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conecta — plataforma integrada de saúde pública.">
  <title>Encaminhamentos | Conecta</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/medico.css">
  <link rel="stylesheet" href="../css/responsividade.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/exames.js" defer></script>
  <script src="../js/medico.js" defer></script>
  <script src="../js/atendimento.js" defer></script>
</head>
<body data-page="encaminhamentos" data-roles="medico">
  <!-- Tela de carregamento -->
  <div class="loader" id="loader" role="status" aria-label="Carregando">
    <span class="logo-crop"><img src="../assets/img/logo-conecta.png" alt="Conecta"></span>
    <div class="loader-bar"><span></span></div>
    <p>Carregando seu ambiente seguro…</p>
  </div>

  <!-- O menu lateral e o cabeçalho são montados por js/main.js (montarShell) -->
  <main>

    <div class="page-head"><div><h1>Encaminhamentos</h1><p>Encaminhe pacientes para especialidades e outras unidades da rede, com o histórico clínico disponível no destino.</p></div></div>
    <div class="grid grid-main">
      <section class="card" aria-labelledby="t-enl">
        <div class="card-header"><h2 id="t-enl"><i data-lucide="send" aria-hidden="true"></i> Encaminhamentos da rede</h2>
          <div class="field"><label for="en-filtro" class="sr-only">Status</label><select class="select" id="en-filtro"><option value="">Todos os status</option><option>Pendente</option><option>Agendado</option><option>Realizado</option></select></div></div>
        <div id="en-lista"></div>
      </section>
      <section class="card" aria-labelledby="t-enn"><div class="card-header"><h2 id="t-enn"><i data-lucide="file-plus-2" aria-hidden="true"></i> Novo encaminhamento</h2></div>
        <form id="form-enc" class="form-grid" novalidate>
          <div class="field span-all"><label for="en-paciente">Paciente <span class="req" aria-hidden="true">*</span></label><select class="select" id="en-paciente" name="paciente" required><option value="">Selecione</option></select><span class="field-error" data-erro-de="en-paciente"></span></div>
          <div class="field span-all"><label for="en-especialidade">Especialidade <span class="req" aria-hidden="true">*</span></label><select class="select" id="en-especialidade" name="especialidade" required><option value="">Selecione</option></select><span class="field-error" data-erro-de="en-especialidade"></span></div>
          <div class="field span-all"><label for="en-destino">Unidade de destino <span class="req" aria-hidden="true">*</span></label><select class="select" id="en-destino" name="destino" required><option value="">Selecione</option></select><span class="field-error" data-erro-de="en-destino"></span></div>
          <div class="field span-all"><label for="en-prioridade">Prioridade</label><select class="select" id="en-prioridade" name="prioridade"><option value="Rotina">Rotina</option><option value="Urgente">Urgente</option><option value="Emergência">Emergência</option></select></div>
          <div class="field span-all"><label for="en-motivo">Motivo / justificativa clínica <span class="req" aria-hidden="true">*</span></label><textarea class="textarea" id="en-motivo" name="motivo" rows="3" required></textarea><span class="field-error" data-erro-de="en-motivo"></span></div>
          <div class="span-all"><button type="submit" class="btn btn-primary btn-block"><i data-lucide="send" aria-hidden="true"></i> Encaminhar paciente</button></div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
